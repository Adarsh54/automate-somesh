name: Redirect GitHub Pages to Cuestamp
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build redirect to the full-stack app
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://cuestamp.com/"><title>Cuestamp</title><a href="https://cuestamp.com/">Open Cuestamp</a></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
